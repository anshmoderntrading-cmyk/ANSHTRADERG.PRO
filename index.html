<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ansh Trader G</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;min-width:0}
:root{--cyan:#00b4ff;--blue:#1a3cff;--violet:#7a1cff;--ink:#14141c}
html,body{min-height:100%;background:#fff;color:var(--ink);font-family:'Poppins',sans-serif;overflow-x:clip}
.bg{position:fixed;inset:0;background:url(bg.jpg) center top/cover no-repeat;opacity:.32;filter:saturate(1.2) contrast(1.1);animation:breathe 7s ease-in-out infinite;z-index:0}
.shade{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,0),rgba(255,255,255,.45) 80%);z-index:1}
@keyframes breathe{0%,100%{opacity:.27}50%{opacity:.38}}
@media(prefers-reduced-motion:reduce){.bg{animation:none}}
main{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:40px 22px 30px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:220px;height:auto;filter:drop-shadow(0 6px 18px rgba(26,60,255,.25))}
.tag{color:#444;font-size:15px;margin-top:10px;line-height:1.5;font-weight:600}
.links{width:100%;margin-top:28px;display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 18px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;font-size:16px;background:#fff;border:1px solid #d3d8e3;box-shadow:0 4px 14px rgba(20,30,80,.08);transition:.2s}
.btn:hover,.btn:active,.btn:focus-visible{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 8px 24px rgba(26,60,255,.2);outline:none}
.ic{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic svg{width:24px;height:24px;fill:#fff}
.tg .ic{background:#229ED9}.yt .ic{background:#FF0000}.ig .ic{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}.tt .ic{background:#000}
.btn .txt{flex:1;text-align:left}
.arrow{color:var(--blue);font-size:22px}
.vf{width:24px;height:24px;flex:none;margin-left:auto}
.fraud{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:10px 16px;border-radius:999px;background:#fff4f4;border:1px solid #ffc9c9;color:#c40000;font-weight:600;font-size:14px;text-decoration:none}
.fraud svg{width:18px;height:18px;flex:none}
.fraud:hover{background:#ffe9e9}
footer{margin-top:34px;font-size:12px;color:#666}
</style>
</head>
